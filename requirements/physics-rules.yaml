spec_version: 0.2.0
rules:
- id: PV-01
  title: 기준 전위 표시
  rule: 기준 전위를 항상 표시하고 사용자가 변경할 수 있게 한다.
- id: PV-02
  title: 동일 net의 동일 전위
  rule: 같은 이상적 도선과 분기점은 같은 숫자·색상·높이를 가진다.
- id: PV-03
  title: 저항의 전위 변화
  rule: 저항에서 양단 전위 사이의 변화를 표현하고 집중소자 표현임을 설명한다.
- id: PV-04
  title: 열린 스위치
  rule: 열린 스위치의 두 단자는 서로 다른 전위를 가질 수 있고 3D에서 연결하지 않는다.
- id: PV-05
  title: 범례
  rule: 색상 범례에 최소·최대·0 V·기준점을 표시한다.
- id: PV-06
  title: 색상 범위
  rule: 단일 회로는 자동 범위를 기본으로 하고 비교에서는 동일한 고정 범위를 사용한다.
- id: PV-07
  title: 부유 영역
  rule: 전위가 정해지지 않은 영역에 임의 색이나 높이를 부여하지 않는다.
- id: PV-08
  title: 색상 대체 표현
  rule: 색만 사용하지 않고 숫자·부호·선 강조를 함께 제공한다.
