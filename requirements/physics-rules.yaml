spec_version: 0.2.0
rules:
- id: PV-01
  title: 기준 전위 표시
  rule: 사용자가 지정한 접지만 표시하고 이동·삭제할 수 있게 한다. 자동 계산 기준의 기호와 안내 문구는 표시하지 않는다.
- id: PV-02
  title: 동일 net의 동일 전위
  rule: 같은 이상적 도선과 분기점은 같은 숫자·색상·높이를 가진다.
- id: PV-03
  title: 저항의 전위 변화
  rule: 저항에서 양단 전위 사이의 변화를 표현하고 집중소자 표현임을 설명한다.
- id: PV-04
  title: 열린 스위치
  rule: 열린 스위치의 두 단자는 서로 다른 전위를 가질 수 있고 3D에서 연결하지 않는다.
- id: PV-05
  title: 범례
  rule: 색상 범례에 최소·최대·0 V를 표시한다. 자동 기준의 위치 설명은 표시하지 않는다.
- id: PV-06
  title: 색상 범위
  rule: 단일 회로는 자동 범위를 기본으로 하고 비교에서는 동일한 고정 범위를 사용한다.
- id: PV-07
  title: 부유 영역
  rule: 전위가 정해지지 않은 영역에 임의 색이나 높이를 부여하지 않는다. 독립 기준 정책은 영역마다 표시된 0 V에 대한 상대 전위를 사용하며, 서로 다른 기준의 높이·수치를 전압차로 비교하지 않는다.
- id: PV-08
  title: 색상 대체 표현
  rule: 색만 사용하지 않고 숫자·부호·선 강조를 함께 제공한다.
- id: CV-01
  title: 구간별 부호 있는 전류
  rule: 전류는 해석 결과와 단자 기준 방향을 따르며 좌표·도선 길이·전위 경사로 추정하지 않는다.
- id: CV-02
  title: 크기와 방향 표현
  rule: 크기는 자동 축척의 비례 띠와 전류에 따른 무늬 밀도로 나타낸다. 무늬는 화면상 등속이고 간격은 상대 전류에 반비례한다. 실제 캐리어 밀도·속도와 동일시하거나 물리적 저장 전하로 적분하지 않는다.
- id: CV-03
  title: 투영 후 등속
  rule: 흐름 무늬는 화면 투영 후 호 길이를 기준으로 등속 이동하며 3D 경사 때문에 빨라지지 않는다.
- id: CV-04
  title: 전류 상태와 연결 정책
  rule: 정확한 0·미세 비영·근사 오차에 따른 방향 불확실·물리적 미정·계산 실패를 구분하고 열린 스위치·전압계·미지원 소자 내부에 임의 전류 경로를 만들지 않는다.
- id: CV-05
  title: 표시 시간과 전기 상태 분리
  rule: 무늬의 이동·개수로 전하 축적·과도 응답·신호 지연을 계산하지 않는다. 새 소자는 명시적 표시 정책과 해석된 상태를 사용한다.

- id: PV-09
  title: 다이오드와 부품 모델의 전위
  rule: 다이오드의 전위차는 A−K이며 비유일 전위를 임의로 채우지 않는다. 선택된 물리 모델의 검증된 전압으로 색과 높이를 함께 만든다.
- id: CV-06
  title: 부품 경계와 사건
  rule: 전원·다이오드·저항의 명시된 독립 경계와 검증된 부품 모델 결과로 위험을 판정한다. 정격은 전류 제한이 아니며 이상 해 실패·계산 미확인·애니메이션 경과 시간을 파손 원인으로 사용하지 않는다.
