- id: TCH-001
  title: 회로도 출력 표기
  state: accepted
  priority: MUST
  phase: 5
  statement: 회로도 출력은 실제 부품 이름·값을 사용한다. 이름 수정은 실제 이름에 반영하며 값은 읽기 전용으로 표시·숨김과 사각 빈칸만 설정한다.
  acceptance:
  - 다이오드 A/K 공통 기호를 화면·독립 SVG·PNG 출력에서 공유한다.
  - 작은 화면(ADR-021)은 출력 보기·화면 이동·확대·복사·저장·그림 설정을 제공하며 이름/값 배치와 주석 편집 도구는 숨긴다. 아래 표기 편집 동작은 넓은 화면에서 제공한다.
  - 터치로 미선택 표기를 길게 눌러 이동하고 선택 표기·명시적 길이 손잡이는 바로 끈다. 이름으로 겹친 대상을 고르고 방향 버튼으로 위치를 조절하며 두 손가락 화면 확대·이동은 문서를 변경하지 않는다.
  - 출력 접지는 기본으로 숨기며 접지 표시 토글을 켜면 0 V 문자 없이 기호만 표시한다.
  - 회로 기호·숫자·단위는 Libertinus Math를 사용하며 일반 앱 문구에는 적용하지 않는다. SVG·PNG에도 같은 폰트를 포함한다.
  - 이름과 값의 위치를 독립적으로 드래그하고 글자 크기를 50~200%로 조절한다.
  - 표시 설정이 닫힌 상태에서도 첫 드래그가 동작한다. 포인터 선택만으로 패널을 열지 않으며 클릭 완료에서 열고 드래그·취소는 기존 열림 상태를 유지한다.
  - 부품의 이름 수정은 SetLabel로 실제 이름을 갱신하고 회로 만들기·측정·전위·출력에서 같은 이름을 사용한다. 실행 취소·다시 실행과 저장에 반영한다.
  - 편집 회로·빠른 값·해당 부품 측정·출력·SVG·PNG는 공통 숫자 표시 모듈과 부품별 옵션을 사용한다.
  - 부품 값은 출력에서 편집할 수 없으며 실제 물리 속성과 계산 결과를 표시한다. 값 변경과 출력 전용 이름·값 설정은 출력 모드의 명령 실행 단계에서도 차단한다.
  - 이름·값의 출력 전용 속성은 표시 여부·빈칸·위치만 사용한다. 출력 전용 문자와 Display 모드는 제거하며 호환 변환을 제공하지 않는다.
