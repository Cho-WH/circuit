- id: DAT-005
  title: 익명 사용 후기·피드백 게시판
  state: accepted
  priority: MUST
  phase: 7
  statement: 회로 데이터와 분리된 댓글형 게시판에서 로그인 조작 없이 후기와 피드백을 작성한다. 로컬 웹앱과 GitHub Pages는 하나의 Firebase Spark 프로젝트를 사용하며 Analytics를 연결하지 않는다.
  acceptance:
  - 글은 종류, 자유 닉네임, 내용, 공개·비공개 설정을 가지며 비밀번호 없이 브라우저 익명 인증으로 관리한다.
  - 공개 목록 응답에는 비공개 및 삭제된 글과 작성자 인증 ID를 포함하지 않는다. 관리 가능 여부는 표시용이며 변경 권한은 어댑터에서 다시 검사한다.
  - 같은 익명 ID는 한국 날짜 기준 하루 3개까지 작성한다. 화면에 제한 횟수나 잔여 횟수를 안내하지 않는다.
  - 삭제 및 비공개 글도 작성 횟수에 포함하며 동시 요청에서도 한도를 넘지 않는다. 수정은 작성 횟수를 소모하거나 환급하지 않는다.
  - 작성자 익명 ID가 일치할 때만 닉네임·내용·종류·공개 범위를 수정하거나 삭제할 수 있다. 수정 시 최초 작성 시각·작성자·ID를 보존하고 수정 시각을 기록한다.
  - 삭제하면 일반 목록에서 사라지고 관리자 보관함에 삭제 시각과 마지막 내용이 남는다.
  - 같은 브라우저에서만 수정·삭제할 수 있다는 한 줄 안내와 물음표 툴팁을 제공한다. 상세 안내에는 사이트 데이터 초기화·시크릿 모드의 영향과 직접 삭제가 어려울 때 관리자에게 별도 요청하는 방법을 포함한다.
  - 로컬 저장 버전 1에서 2로 이전할 때 작성자·공개 범위·삭제 기록을 보존하고 새 저장 자료에서 비밀번호 검증 자료를 제거한다.
  - 공개 목록, 본인 글, 관리자 조회는 서로 다른 접근 권한을 가지며 원격 연결 시 서버에서 강제한다.
  - 로컬 미리보기는 브라우저 내 저장임을 표시한다. 일반 게시판에 관리자 진입점을 두지 않고 별도 admin/feedback/ 페이지를 제공한다. 운영 관리자 인증 미연결 시 기록을 반환하지 않는다.
  - 모바일·키보드로 작성·수정·삭제와 상세 안내 확인이 가능하고 실패 시 입력값을 유지한다.
  - Firebase 익명 인증과 관리자 Google 인증은 서로 다른 세션으로 보존한다. 관리자 권한은 서버의 UID 허용 목록으로 확인하며 일반 클라이언트는 이를 변경할 수 없다.
  - 원문과 공개 사본 및 작성 할당 슬롯은 원자적으로 동기화한다. 작성자 UID와 비공개·삭제 원문은 공개 문서에 포함하지 않는다.
  - Analytics SDK 초기화·측정 ID·분석 이벤트를 추가하지 않으며 회로 문서는 게시판 서버로 전송하지 않는다.
