- id: VIS-004
  title: 전위 높이 지도
  state: accepted
  priority: MUST
  phase: 3
  statement: 2D 회로를 전위 높이 지도로 전환한다.
  acceptance:
  - 부품 특성 적용은 작은 표시로 구별한다. 물리 경계 판정과 애니메이션 시계는 독립이다.
  - 2D와 3D의 x-y 위치 대응을 유지한다.
  - 2D → 3D 진입의 높이·카메라 애니메이션은 운영체제·브라우저의 움직임 감소 설정과 관계없이 재생한다. 첫 진입 1100ms·동일 문서 재진입 900ms이며 사용자 카메라 조작으로 중단할 수 있다.
  - 3D 선택은 같은 단일 포인터의 정지 탭에서만 수행한다. 카메라 드래그의 원위치 복귀·다중 터치·포인터 취소는 선택을 바꾸지 않는다.
  - 자유 회전 중 수평 주변에서는 인력을 적용하고 중심의 좁은 구간에서는 정확한 수평을 유지하되 계속 드래그하여 통과할 수 있다. 좌우 방향·확대 배율·회전 중심을 보존하고 드래그를 놓으면 그 시점을 유지한다.
  - 기준 전위와 높이 축척을 표시한다.
  - 3D 진입 시 실제 표시 영역과 기본 사선 시점을 기준으로 높이를 자동 맞춤한다. 전압 단위가 달라도 높이는 적정 범위에 유지되며 전위차와 높이차는 선형 비례한다.
  - 높이 조절은 자동 축척에 대한 상대 배율이다. 영역 크기·카메라 조작 중 목표 높이를 유지하며 보기 초기화로 현재 영역에 다시 맞춘다.
  - 전압 탐침의 동일 x-y·net 높이를 표시하고 두 높이의 수직 차를 치수선으로 나타낸다. 미연결·전위 미정에는 확정 눈금을 만들지 않으며 0 V의 높이 차는 0이다.
  - 열린 스위치의 단자를 연결하지 않는다.
