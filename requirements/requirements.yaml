  - FIX-03
  - FIX-05
  - FIX-07
  docs: []
- id: VIS-003
  title: 등전위 영역 강조
  state: accepted
  priority: MUST
  phase: 3
  statement: 선택한 절점과 같은 등전위 영역 전체를 강조한다.
  acceptance:
  - 해당 net의 모든 도선·단자·분기점을 함께 강조한다.
