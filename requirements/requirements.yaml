  - 저항 측정 UI는 탐침 위치와 무관하게 모든 직류 전원을 개방하고 나머지 수동 경로를 유지한다.
  - 직렬 3 Ω·6 Ω 회로에서 각 저항은 3 Ω·6 Ω, 전체는 9 Ω이며 병렬 연결에서는 2 Ω이다.
  - 전원이 있는 회로는 도구 영역의 짧은 안내와 전지 분리하고 측정 버튼으로 시작하며, 전원이 없는 회로는 즉시 측정한다.
  - 전원 기호와 표기를 흐리게, 리드 연결을 끊어 표시한다. 분리 중 정상 작동 상태의 전위 색상·숫자·전류·3D 표현을 잠시 숨긴다.
  - 원본 회로를 보존하고 도구 종료 시 이전 보기 설정을 복원한다.
  - 독립원 처리와 1 V 시험 전원 방식을 테스트한다.
  - 연결 없음과 0 Ω 조건을 진단한다.
