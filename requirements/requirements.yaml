- id: MEA-001
  title: 두 탐침 전압 측정
  state: accepted
  priority: MUST
  phase: 4
  statement: 두 탐침으로 전위차를 측정하고 방향에 따른 부호를 표시한다.
  acceptance:
  - 다이오드의 전압·전류는 선택된 한 모델의 관측량이며 전류 방향은 A→K다. 파손 사건 후 현재 측정·새 기록은 중단한다.
  - 회로 만들기 / 분석하기 / 회로도 출력의 작업 구조에서 분석하기 안에 보기 설정과 선택형 측정 도구를 제공한다.
  - 작은 화면은 같은 높이의 바에서 보기/측정 도구를 교체한다. 전환과 측정표 열기는 회로의 화면상 위치를 바꾸지 않으며 뒤로에서 위치·기록·보기 설정을 보존한다.
  - 도구 선택은 전위·전류 표시 설정을 유지하며 도구·보기 전환에서 측정 위치와 기록을 보존한다. 탐침 배치는 2D에서 지원하며 전압 탐침은 3D 전환 후에도 위치·측정값·탐침 교환·기록을 유지한다. 3D에서 위치 변경은 명시적인 2D 복귀 버튼으로 제공한다.
  - 분석 중 부품 값을 바꾸면 측정값을 갱신하며 구조 편집은 명령 단계에서 제한한다.
  - 탐침 순서를 바꾸면 크기는 같고 부호만 반전된다.
  - 미연결 탐침에는 확정 수치를 표시하지 않는다.
