- id: EDT-002
  title: 직각 도선 연결
  state: accepted
  priority: MUST
  phase: 2
  statement: 단자에서 도선을 시작해 수평·수직 경로로 연결할 수 있다.
  acceptance:
  - 연결 전 경로 미리보기를 표시한다.
  - 연결 후 실제 분기점이 명확히 표시된다.
  - 시작 단자와 끝 도선을 차례로 눌러 분기 배선을 만들며 기존 꺾임을 보존한다.
  - 기본 선택 상태에서 단자 강조와 클릭으로 배선을 시작하고, 선택 도선의 분기 후보에서 새 배선을 시작한다.
  - 분기 시작점은 완료 전까지 임시 상태이며 취소 시 원본을 유지하고 완료 시 한 번의 실행 취소로 복원한다.
  - 터치에서는 도선 도착 후보를 탭으로 조정하고 명시적인 버튼으로 확정하며 겹치는 후보를 임의로 선택하지 않는다.
  - 배선 중 빈 공간 클릭·탭은 경유 구간을 확정한다. 가로/세로 우선 전환은 마지막 미확정 구간만 바꾸며 마지막 경유점 되돌리기와 전체 취소를 구분한다.
  - 선택 도선의 사각 선분 손잡이는 마우스·터치 드래그와 방향키로 해당 구간에 수직인 방향만 이동한다. 양 끝 연결 ID와 다른 도선은 바뀌지 않는다.
  - 도선 기하 계산, 문서 명령, UI 상태의 책임을 분리한다. 미리보기와 확정·저장·출력은 같은 경로를 사용하고 추가 잠금 상태 없이 기존 waypoints를 저장한다.
  - 도선 삭제로 영향을 받은 분기점은 앵커가 없을 때 연결 0개면 제거, 1개면 열린 끝 유지, 2개면 경로 병합, 3개 이상이면 유지한다. 굴곡·되접힘과 폐곡선의 필수 끝점을 보존한다.
