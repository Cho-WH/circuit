- id: EDT-003
  title: 교차와 연결 구분
  state: accepted
  priority: MUST
  phase: 2
  statement: 도선 교차와 실제 전기 연결을 구분한다.
  acceptance:
  - 분기점이 없는 교차는 같은 net으로 묶이지 않는다.
  - 네 갈래 직교 교차를 눌러 공통 분기점 연결과 가로·세로 비연결로 전환하고 실행 취소한다.
  - 교차 분리 명령은 모호한 다중 교차·T자 또는 기준점·주석이 달린 분기점을 거절하고 원본을 유지한다.
  - 비연결 직교 교차의 가로 도선은 아치로 표시하며 편집·SVG·PNG에 같은 규칙을 적용한다.
  - 별도 교차 도구 없이 네 갈래 직교 교차점 클릭으로 연결·해제를 전환한다. 나머지 일반 분기점은 끝단과 같은 기존 처리로 바로 배선을 시작한다. 현재 상태만 연결·비연결로 표시한다. 진행 중인 배선은 연결점을 도착점으로 사용한다.
  modules:
