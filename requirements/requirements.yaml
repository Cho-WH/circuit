requirements:
- id: EDT-001
  title: 기본 부품 조작
  state: accepted
  priority: MUST
  phase: 2
  statement: 사용자는 기본 부품을 캔버스에 배치·이동·회전·삭제할 수 있다.
  acceptance:
  - 다이오드는 공통 기호와 명시적인 A/K 단자를 사용하며 배치·회전·삽입·삭제를 기존 명령으로 처리한다.
  - 새 빈 회로 생성에 성공하면 만들기·편집 화면으로 전환한다. 데스크톱은 부품 목록을 표시하고 작은 화면은 +부품 버튼으로 목록을 연다. 기존 파일 열기·보관본 복원의 작업 모드는 유지한다.
  - 마우스와 터치에서 같은 문서 결과가 생성된다.
  - 터치는 라이브러리 탭 후 배치 또는 길게 눌러 끌기를 지원한다. 빈 공간은 해제 시 한 번 배치하고 도선 삽입은 기호·방향·양쪽 연결을 확인한 뒤 삽입 버튼으로 확정한다.
  - 미선택 부품의 짧은 스와이프는 화면 이동이며 길게 누르면 부품을 집는다. 선택 부품은 바로 끌거나 이동·목적지 탭·놓기로 이동할 수 있다.
  - 가변저항은 지그재그와 대각선 화살표로 표시하고 일반 저항과 같은 두 단자·저항값 모델로 계산한다.
  - 각 동작을 실행 취소하고 다시 실행할 수 있다.
  - 새 두 단자 부품을 충분히 긴 도선 구간에 직렬 삽입하며 기존 우회 도선을 남기지 않는다. 전압계는 자동 삽입하지 않는다.
  - 삽입 기호·방향·연결 경로의 미리보기와 확정 결과가 같고 한 번의 실행 취소로 복원된다.
  - 부품 이동·회전은 연결된 도선의 가장 가까운 코너만 직각으로 보정하고 가운데 경로와 분기점·다른 가지를 보존한다. 양 끝 변위가 같으면 도선 경로 전체를 평행 이동한다.
  - 이동 미리보기와 확정은 시작 문서와 최종 좌표를 같은 명령에 전달한다. 포인터가 지나간 경로에 따라 결과가 달라지지 않으며 원위치 복귀는 기록을 남기지 않는다.
  - 연결된 두 단자 부품을 삭제하면 기존 경로를 보존하며 부품 자리를 도선으로 잇는다. 삭제로 생긴 연결점에 도선 끝이 두 개만 만나고 기준점·주석이 없으면 경로를 합쳐 불필요한 분기점을 남기지 않는다. 연결이 없는 부품은 흔적 없이 삭제한다.
  - 실제 분기·열린 끝·앵커는 유지하고 삭제로 영향을 받지 않은 분기점은 정리하지 않는다. 미지원 다단자 입력 삭제는 단자별 외부 연결만 보존하며 서로 다른 단자를 연결하지 않는다.
  - 앵커 없는 두 도선 접점은 경로를 합쳐 삽입 후보를 계산한다. 미리보기와 확정은 같은 규칙을 적용하고 확정은 선택한 경로만 정리한다.
  - 분기·앵커·코너 주변의 배치 실패는 짧은 원과 X 효과만 표시하며 이유나 근처 위치를 안내하지 않는다. 문서·이력과 배치 초안을 유지한다.
  - 함께 선택한 도선 삭제가 우선한다. 복수 부품 삭제는 선택 순서와 무관하며 좌표가 같은 다른 연결점과 합치지 않는다.
  - 대체 단자에 붙은 기준점과 주석 위치를 보존하고 부품·도선·참조 변경을 한 번에 실행 취소한다. 삭제 버튼과 Delete 키는 같은 명령을 사용한다.
