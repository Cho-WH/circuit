  statement: 비접촉 센서로 부품이나 도선 구간의 전류를 읽고 회로 배치와 연결을 보존한다.
  acceptance:
  - 다이오드 측정 기록은 선택한 물리 모델·프로필 버전·정확/근사 연산 품질을 조건과 함께 보존한다.
  - 전류 센서를 놓으면 크기와 실제 전류 방향을 표시한다.
  - 분기 전후 도선 전류를 구분하고 값이 유일하지 않은 도선 고리는 미정으로 표시한다.
  - 탐침과 센서는 클릭·탭 또는 드래그로 놓고 키보드로 대상을 선택할 수 있다.
  - 회로 만들기에서 직접 연결한 전류계의 전원 양단 병렬 연결을 진단한다.
