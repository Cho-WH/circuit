- id: SIM-008
  title: 선형 직류의 정확 우선 연산과 계산 예산
  state: accepted
  priority: MUST
  phase: 1
  statement: 이상적인 선형 직류 회로의 입력·회로 저장은 정확 유리수를 유지하고 해석은 정확 계산을 우선한다. 정해진 계산 예산을 넘으면 품질을 명시한 근사 해석을 사용하며 측정·기록·시각화까지 구분을 보존한다. 채택 명세이며 구현 상태는 current-phase에서 별도로 관리한다.
  acceptance:
  - 물리 모델의 근사와 수치 연산의 근사를 구별한다. 근사 오차가 위험 경계를 가로지르면 확인되지 않은 정상·파손을 확정하지 않는다.
  - 정확 경로는 정규화한 BigInt 분자·분모로 MNA와 전압·전류·전력·도선 KCL·등가저항을 계산한다. 0·부호·전원 제약·특이성은 정확 비교로 판정한다.
  - FIX-09 균형점의 중앙 저항과 양쪽 도선 전류는 정확히 0 A이며, 실제 비영 전류는 크기와 무관하게 보존한다. KCL·KVL·전력 보존과 기준점 변경 불변성을 정확값으로 확인한다.
  - 회로 JSON의 물리값은 정규형 정수 문자열 쌍이다. 현재 회로 v6·측정 기록 v5를 지원한다. 기록은 정확/근사 구분과 근사의 필수 오차 메타데이터를 보존하며, 이전 형식 변환 없이 현재 형식 왕복과 지원 밖 입력 거부를 검증한다.
  - 표시 반올림은 값의 소비 경계에서 수행한다. 근사 결과에는 품질을 명시하고 표시용 반올림값을 계산·기록의 원본으로 되돌리지 않는다.
  - 수동·자동 조절은 정수 단계 또는 확정 소수를 정확 입력으로 만든다. 정확 해석 한 번의 중간 정수 크기는 4096비트, GCD 내부 나머지 연산은 1000000회까지 허용하며 어느 한 예산을 넘기 전에 근사 경로로 전환한다. 시간·FPS·기기 성능·이전 계산 이력으로 경로를 바꾸지 않는다.
  - 근사 경로는 공통 MNA 구성과 행·열 스케일 조정, binary64 부분 피벗 LU, 최대 2회의 잔차 보정을 사용한다. 잔차·민감도·오차 추정으로 수용하고 표현 범위 초과나 신뢰하기 어려운 해는 구조화 실패로 반환한다. 정확히 확인된 전기적 모순·미정과 정확 잔차 실패는 근사 성공으로 대체하지 않는다.
  - 근사 측정값의 ≈와 품질 정보를 기록·복사/CSV·2D·3D까지 보존한다. 추정 오차로 부호를 판단할 수 없는 전류는 방향 불확실로 전달하여 방향성 입자를 생략하고 정확한 0과 구분한다. 수용 임계값과 오차 추정 방법은 계산 명세 §7.6의 dc-budget-1을 따른다.
