- id: MEA-003
  title: 측정 기록과 CSV
  state: accepted
  priority: SHOULD
  phase: 4
  statement: 측정값을 표에 고정하고 CSV로 내보낸다.
  acceptance:
  - 다른 물리 모델·프로필·저장된 부품 편차를 같은 연속 측정 조건으로 묶지 않는다. CSV에도 그 출처를 보존한다.
  - 측정표·경로 그래프는 필요할 때 하나씩 연다. 기록 버튼은 닫힌 측정표를 자동으로 열지 않는다.
  - 측정 위치·단위·탐침 순서 또는 전류 방향·전원 분리 조건을 당시 회로와 함께 보존하고 같은 전기적 조건끼리 묶는다. 사용자용 위치는 연결된 부품과 단자로 표현하며 내부 분기점·도선 ID를 노출하지 않는다.
  - 행별 메모 수정·삭제, 전체 기록 초기화, 표 복사와 CSV 저장을 제공한다. 기록 당시 회로는 읽기 전용으로 확인하며 도선 구간·구간 내 비율을 포함한 당시 탐침·센서 위치를 그대로 표시한다.
  - 측정 기록은 CircuitDocument와 별도로 로컬에 저장해 새로고침 후 복원하며 저장 실패를 알린다.
  - 열 이름과 단위를 포함한다.
