- id: EDT-004
  title: 부품 이름·값 직접 편집
  state: accepted
  priority: MUST
  phase: 2
  statement: 부품 이름과 값을 회로 위에서 함께 수정하고 단위를 표준화한다.
  acceptance:
  - 다이오드의 교과서 강하는 7/10 V로 고정한다. 부품 모델의 실제 계산 전압과 설정 강하를 구별한다.
  - 이름과 값을 한 번에 적용하며 한 번의 실행 취소로 함께 복원한다. 빈 이름과 잘못된 값은 부분 적용하지 않는다.
  - 스위치의 회로 위 이름·값 수정창에서 열림·닫힘 상태를 선택한다. 상태 버튼은 즉시 반영하며 이름 초안은 유지한다. 이름만 적용 버튼으로 확정하고 취소해도 이미 바꾼 상태는 유지한다. 상태 변경도 명령 단계에서 권한을 검사한다.
  - R_1과 R_{eq} 이름을 아래첨자로 표시하며 재편집과 저장에는 원문을 유지한다. 화면·SVG·PNG는 같은 표기를 사용한다.
  - 1k와 1000 Ω은 같은 내부값으로 저장된다. p·n·u/μ/µ·m·k·M을 입력으로 받는다.
  - 소수·분수·접두어를 정확한 정수 비율로 결합하고 SIM-008에 따라 저장·계산까지 유지한다. 10u 입력과 분수 재편집에서 반올림 오차가 누적되지 않는다.
  - 상세 설정의 값 입력 아래에서 부품별 자동 단위(기본)·유효 숫자(4자리 지수)·원래 숫자를 선택하고 저장한다. 지수는 e 대신 10의 거듭제곱으로 표시하며 실제 값은 변경하지 않는다.
  - 전체 적용은 선택한 부품의 표시 방식을 모든 부품에 한 번의 명령 묶음으로 적용한다. 권한을 검사하며 한 번의 실행 취소로 복원한다.
  - 값 적용 버튼 없이 Enter 또는 포커스 이동으로 값을 확정하며 Escape로 입력 초안을 취소한다.
  - 이름은 모든 편집 경로와 명령 단계에서 공백 제거 후 1~160자로 검증하고 Enter 또는 포커스 이동으로 확정하며 Escape로 취소한다.
  - 3/4와 단위를 포함한 분수 입력을 수치로 해석하고 입력한 분수 표기를 저장·재편집과 자동 단위 표시에서 유지한다. 지수·원래 숫자 표시에서도 저장 원문은 유지한다. 자동 계산 결과는 분수로 추정하지 않는다.
  - 분모 0과 불완전한 분수는 이전 값을 변경하지 않는다.
  - 파싱 실패 시 이전 값을 유지한다.
  - 값 옆 입력창에서 Enter로 적용하고 Escape로 취소하며 입력 오류를 같은 위치에 표시한다.
  - 키보드와 화면 크기 변화에서 편집 초안·선택·화면 배율을 보존하고 대상과 적용·취소를 보이게 한다. 자동 시야 보정의 복구는 이후 사용자 이동·확대를 덮어쓰지 않는다.
  modules:
  - editor
  - domain
  - component-library
  physics_rules: []
  fixtures: []
  docs:
