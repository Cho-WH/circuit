requirements:
- id: EDT-001
  title: 기본 부품 조작
  state: accepted
  priority: MUST
  phase: 2
  statement: 사용자는 기본 부품을 캔버스에 배치·이동·회전·삭제할 수 있다.
  acceptance:
  - 마우스와 터치에서 같은 문서 결과가 생성된다.
  - 각 동작을 실행 취소하고 다시 실행할 수 있다.
  - 새 두 단자 부품을 충분히 긴 도선 구간에 직렬 삽입하며 기존 우회 도선을 남기지 않는다. 전압계는 자동 삽입하지 않는다.
  - 삽입 기호·방향·연결 경로의 미리보기와 확정 결과가 같고 한 번의 실행 취소로 복원된다.
  modules:
  - editor
  - component-library
  physics_rules: []
  fixtures: []
  docs:
  - docs/ux/interactions.md
- id: EDT-002
  title: 직각 도선 연결
  state: accepted
  priority: MUST
  phase: 2
  statement: 단자에서 도선을 시작해 수평·수직 경로로 연결할 수 있다.
  acceptance:
  - 연결 전 경로 미리보기를 표시한다.
  - 연결 후 실제 분기점이 명확히 표시된다.
  - 시작 단자와 끝 도선을 차례로 눌러 분기 배선을 만들며 기존 꺾임을 보존한다.
  - 기본 선택 상태에서 단자 강조와 클릭으로 배선을 시작하고, 선택 도선의 분기 후보에서 새 배선을 시작한다.
  - 분기 시작점은 완료 전까지 임시 상태이며 취소 시 원본을 유지하고 완료 시 한 번의 실행 취소로 복원한다.
  - 터치에서는 도선 도착 후보를 탭으로 조정하고 명시적인 버튼으로 확정하며 겹치는 후보를 임의로 선택하지 않는다.
  modules:
  - editor
  - connectivity
  physics_rules: []
  fixtures: []
  docs:
  - docs/ux/interactions.md
- id: EDT-003
  title: 교차와 연결 구분
  state: accepted
  priority: MUST
  phase: 2
  statement: 도선 교차와 실제 전기 연결을 구분한다.
  acceptance:
  - 분기점이 없는 교차는 같은 net으로 묶이지 않는다.
  - 네 갈래 직교 교차를 선택해 공통 분기점 연결과 가로·세로 비연결로 전환하고 실행 취소한다.
  - 모호한 다중 교차·T자 분리 또는 기준점·주석이 달린 분기점 분리는 안내하고 원본을 유지한다.
  - 비연결 직교 교차의 가로 도선은 아치로 표시하며 편집·SVG·PNG에 같은 규칙을 적용한다.
  - 별도 교차 도구 없이 교차점 클릭으로 연결·해제를 전환하고 현재 상태만 연결·비연결로 표시한다. 진행 중인 배선은 연결점을 도착점으로 사용한다.
  modules:
  - editor
  - connectivity
  physics_rules: []
  fixtures:
  - FIX-02
  - FIX-03
  docs: []
- id: EDT-004
  title: 부품값 직접 편집
  state: accepted
  priority: MUST
  phase: 2
  statement: 부품값을 회로 위에서 직접 수정하고 단위를 표준화한다.
  acceptance:
  - 1k와 1000 Ω은 같은 내부값으로 저장된다.
  - 파싱 실패 시 이전 값을 유지한다.
  - 값 옆 입력창에서 Enter로 적용하고 Escape로 취소하며 입력 오류를 같은 위치에 표시한다.
  modules:
  - editor
  - domain
  - component-library
  physics_rules: []
  fixtures: []
  docs:
  - docs/physics/measurement-and-display.md
- id: EDT-005
  title: 선택과 편집 도구
  state: accepted
  priority: MUST
  phase: 2
  statement: 복수 선택, 복사·붙여넣기, 정렬, 확대·이동을 지원한다.
  acceptance:
  - 복사된 요소는 새 ID를 가진다.
  - 배선 연결이 우연히 원본과 공유되지 않는다.
  - 터치 화면 이동·두 손가락 확대 및 취소된 제스처는 부품 이동이나 배선 확정으로 처리하지 않는다.
  modules:
  - editor
  physics_rules: []
  fixtures: []
  docs: []
