requirements:
- id: EDT-001
  title: 기본 부품 조작
  state: accepted
  priority: MUST
  phase: 2
  statement: 사용자는 기본 부품을 캔버스에 배치·이동·회전·삭제할 수 있다.
  acceptance:
  - 마우스와 터치에서 같은 문서 결과가 생성된다.
  - 각 동작을 실행 취소하고 다시 실행할 수 있다.
  modules:
  - editor
  - component-library
  physics_rules: []
  fixtures: []
  docs:
  - docs/ux/interactions.md
- id: EDT-002
  title: 직각 도선 연결
  state: accepted
  priority: MUST
  phase: 2
  statement: 단자에서 도선을 시작해 수평·수직 경로로 연결할 수 있다.
  acceptance:
  - 연결 전 경로 미리보기를 표시한다.
  - 연결 후 실제 분기점이 명확히 표시된다.
  modules:
  - editor
  - connectivity
  physics_rules: []
  fixtures: []
  docs:
  - docs/ux/interactions.md
- id: EDT-003
  title: 교차와 연결 구분
  state: accepted
  priority: MUST
  phase: 2
  statement: 도선 교차와 실제 전기 연결을 구분한다.
  acceptance:
  - 분기점이 없는 교차는 같은 net으로 묶이지 않는다.
  modules:
  - editor
  - connectivity
  physics_rules: []
  fixtures:
  - FIX-02
  - FIX-03
  docs: []
- id: EDT-004
  title: 부품값 직접 편집
  state: accepted
  priority: MUST
  phase: 2
  statement: 부품값을 회로 위에서 직접 수정하고 단위를 표준화한다.
  acceptance:
  - 1k와 1000 Ω은 같은 내부값으로 저장된다.
  - 파싱 실패 시 이전 값을 유지한다.
  modules:
  - editor
  - domain
  - component-library
  physics_rules: []
  fixtures: []
  docs:
  - docs/physics/measurement-and-display.md
- id: EDT-005
  title: 선택과 편집 도구
  state: accepted
  priority: MUST
  phase: 2
  statement: 복수 선택, 복사·붙여넣기, 정렬, 확대·이동을 지원한다.
  acceptance:
  - 복사된 요소는 새 ID를 가진다.
  - 배선 연결이 우연히 원본과 공유되지 않는다.
  modules:
  - editor
  physics_rules: []
  fixtures: []
  docs: []
- id: EDT-006
  title: 배선 자동 정리
  state: accepted
  priority: SHOULD
  phase: 2
  statement: 자동 배선 정리는 적용 전 변경될 경로를 미리 보여 준다.
  acceptance:
  - 적용 결과를 한 번의 실행 취소로 되돌릴 수 있다.
  modules:
  - editor
  physics_rules: []
  fixtures: []
  docs: []
- id: EDT-007
  title: 기호 세트 교체 경계
  state: accepted
  priority: LATER
  phase: later
  statement: 부품 논리와 회로 기호 정의를 분리한다.
  acceptance:
  - 기호 세트를 바꿔도 회로 연결과 계산 모델이 바뀌지 않는다.
  modules:
  - component-library
  - export
  physics_rules: []
  fixtures: []
  docs: []
- id: SIM-001
  title: 연결망 컴파일
  state: accepted
  priority: MUST
  phase: 1
  statement: 회로 문서에서 전기적으로 같은 단자와 도선을 절점(net)으로 묶는다.
  acceptance:
  - 좌표가 같아도 명시적 연결이 없으면 같은 net이 아니다.
  - 분기점 없는 교차선은 연결되지 않는다.
  modules:
  - connectivity
  - domain
  physics_rules: []
  fixtures:
  - FIX-01
  - FIX-02
  - FIX-03
  docs: []
- id: SIM-002
  title: 직류 전위와 전류 계산
  state: accepted
  priority: MUST
  phase: 1
  statement: 직류 저항 회로의 절점 전위와 가지 전류를 계산한다.
  acceptance:
  - FIX-01~FIX-05, FIX-09, FIX-10의 기대값과 허용 오차 내에서 일치한다.
  modules:
  - simulation
  - connectivity
  physics_rules: []
  fixtures:
  - FIX-01
  - FIX-02
  - FIX-03
  - FIX-04
  - FIX-05
  - FIX-09
  - FIX-10
  docs: []
- id: SIM-003
  title: 부품 전압과 전력
  state: accepted
  priority: MUST
  phase: 1
  statement: 부품 양단 전압과 전력을 계산한다.
  acceptance:
  - 전력 부호 규칙이 모든 화면과 출력에서 일관된다.
  - 저항의 소비 전력은 수동 부호 규약에서 음수가 아니다.
  modules:
  - simulation
  physics_rules: []
  fixtures:
  - FIX-01
  - FIX-02
  - FIX-03
  - FIX-04
  - FIX-09
  docs: []
- id: SIM-004
  title: 회로 진단
  state: accepted
  priority: MUST
  phase: 4
  statement: 부유 회로, 전원 단락, 충돌 전원, 미연결 단자를 진단한다.
  acceptance:
  - 앱이 멈추지 않는다.
  - 진단 코드, 영향 요소, 수정 행동을 반환한다.
  - 해가 정의되지 않은 경우 수치값을 꾸며내지 않는다.
  modules:
  - diagnostics
  - simulation
  - connectivity
  physics_rules: []
  fixtures:
  - FIX-06
  - FIX-07
  - FIX-08
  docs: []
- id: SIM-005
  title: 등가저항
  state: accepted
  priority: SHOULD
  phase: 4
  statement: 선택한 두 점 사이 등가저항을 계산한다.
  acceptance:
  - 독립원 처리와 1 V 시험 전원 방식을 테스트한다.
  - 연결 없음과 0 Ω 조건을 진단한다.
  modules:
  - simulation
  - measurement
  physics_rules: []
  fixtures:
  - FIX-01
  - FIX-02
  - FIX-03
  - FIX-04
  - FIX-09
  docs: []
- id: SIM-006
  title: KCL·KVL 확인
  state: accepted
  priority: SHOULD
  phase: 4
  statement: 분기점 KCL과 선택 경로 KVL을 계산해 표시한다.
  acceptance:
  - 허용 오차 이하일 때 성립으로 표시한다.
  - 회로 요소와 식의 항을 대응시킨다.
  modules:
  - simulation
  - visualization
  physics_rules: []
  fixtures:
  - FIX-02
  - FIX-03
  - FIX-04
  - FIX-09
  docs: []
- id: SIM-007
  title: 계산 엔진 교체 경계
  state: accepted
  priority: LATER
  phase: later
  statement: 다른 계산 엔진을 같은 공개 계약으로 추가할 수 있다.
  acceptance:
  - UI는 SimulationEngine 인터페이스만 사용한다.
  modules:
  - simulation
  - app
  physics_rules: []
  fixtures: []
  docs: []
