  state: accepted
  priority: MUST
  phase: 3
  statement: 각 주요 절점의 전위를 숫자로 표시한다.
  acceptance:
  - 기준점과 단위를 함께 표시한다.
  - 같은 net은 같은 수치 객체를 참조한다.
