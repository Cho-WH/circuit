- id: EDT-005
  title: 선택과 편집 도구
  state: accepted
  priority: MUST
  phase: 2
  statement: 복수 선택, 복사·붙여넣기, 정렬, 확대·이동을 지원한다.
  acceptance:
  - 복사된 요소는 새 ID를 가진다.
  - 모바일 팔레트는 빈 회로, 예제 회로, 세로 구분선, 부품 목록 순서로 배치하며 빈 회로는 아이콘 아래 이름을 표시한다. 예제 선택은 파일 메뉴와 공통 메뉴 조작을 사용한다.
  - 분기점 선택 메뉴와 수동 삭제를 제공하지 않는다. DeleteElements에 노드 ID가 포함되면 전체 명령을 거절하고 연결된 도선·앵커·이력을 유지한다.
  - 배선 연결이 우연히 원본과 공유되지 않는다.
  - 터치 화면 이동·두 손가락 확대 및 취소된 제스처는 부품 이동이나 배선 확정으로 처리하지 않는다.
  - 측정 손잡이·부품·출력 표기의 이동 중 두 번째 손가락은 편집 미리보기를 취소하고 화면 이동·핀치로 전환한다. 잔여 손가락 해제와 후속 클릭은 편집을 확정하지 않는다.
  - 겹친 터치 후보는 이름으로 선택하며 문서·배율 변화가 다른 ID의 자동 선택으로 이어지지 않는다. 화면 크기 변화는 진행 중 드래그를 확정하지 않는다.
  modules:
  - editor
  physics_rules: []
  fixtures: []
  docs: []
- id: EDT-007
  title: 기호 세트 교체 경계
  state: accepted
  priority: LATER
  phase: later
  statement: 부품 논리와 회로 기호 정의를 분리한다.
  acceptance:
  - 만들기 사전 경고는 현재 확정값으로 지금 분석에 진입한 결과만 표시하며 과부하·파손 연출은 분석 세션에서만 발생한다.
  - 기호 세트를 바꿔도 회로 연결과 계산 모델이 바뀌지 않는다.
  modules:
  - component-library
  - export
  physics_rules: []
  fixtures: []
  docs: []
- id: EDT-008
  title: 가변저항 범위와 실시간 조절
  state: accepted
  priority: SHOULD
  phase: 4
  statement: 회로 만들기에서 가변저항 범위를 정하고 분석하기에서 측정과 함께 연속 조절한다.
  acceptance:
  - 다이오드 연속 조절은 부품 모델을 유지한다. 자동 왕복은 논리적 이산 위치를 순서대로 검사하고 첫 위험에서 멈추며 노랑 수동 조절은 허용한다.
  - 가변저항은 두 단자 저항이며 양수 최솟값·최댓값과 현재값을 저장한다. 범위 축소 시 현재값을 범위 안으로 제한하고 한 명령으로 적용한다. 범위 없는 이전 문서의 값은 보존한다.
  - 회로 만들기의 회로 위 값 편집과 상세 설정은 현재 저항값과 범위를 편집한다. 현재값은 분석하기의 계산과 조절기에 그대로 이어진다. 분석하기 슬라이더는 저장된 최솟값·최댓값 사이에서 움직인다.
  - 왼쪽 패널의 슬라이더는 움직이는 동안 최신 값을 프레임당 최대 한 번 반영하고 놓을 때 마지막 값을 확정한다. 수치 입력은 Enter/포커스 이동으로 적용한다.
  - 가변저항 조절창은 회로에서 해당 부품을 선택할 때만 표시한다. 여러 가변저항도 회로에서 직접 고르며 별도 선택 목록을 두지 않는다. 선택 해제·다른 부품 선택으로 창이 숨겨져도 자동 조절은 유지하고, 다시 선택하면 실행 상태를 표시한다.
  - 한 번의 연속 조작은 한 번에 실행 취소한다. 모든 값 변경은 명령 권한과 문서 검증을 거친다.
  - 조절 중 전위 색·3D 높이와 눈금·전류 두께와 간격의 기준 축척을 유지한다. 사용자 배율·탐침·기록·시점을 보존하고 3D 진입 애니메이션을 재시작하지 않는다.
  - 슬라이더 아래의 저항 자동 조절 재생 버튼으로 범위를 천천히 왕복한다. 실행 중에는 일시 정지 버튼으로 바뀌며 정지한 값에서 다시 재생한다. 직접 조작·멈춤·분석 종료·회로 교체·숨겨진 탭에서 멈춘다.
  - 실제 직류 계산값을 시각화·측정·기록에 함께 사용한다. 기록 당시 가변저항값은 기존 회로 조건에 보존한다.
