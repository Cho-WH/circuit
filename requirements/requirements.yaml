  state: accepted
  priority: MUST
  phase: 3
  statement: 전위를 색으로 표시하고 범례를 제공한다.
  acceptance:
  - 같은 net은 같은 색이다.
  - 색만으로 의미를 전달하지 않는다.
  - 부유 영역에는 임의 색을 주지 않는다.
