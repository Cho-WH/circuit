spec_version: 0.2.0
principles:
- id: P-01
  title: 교과서처럼 익숙하다
  rule: 표준 회로 기호와 교과 용어를 기본으로 사용한다.
- id: P-02
  title: 프레젠테이션 앱처럼 직접 조작한다
  rule: 부품을 놓고 선을 잇고 값을 화면에서 바로 수정한다.
- id: P-03
  title: 실험 장치처럼 즉시 반응한다
  rule: 회로가 바뀌면 복잡한 실행 설정 없이 결과를 갱신한다.
- id: P-04
  title: 정보를 한꺼번에 쏟지 않는다
  rule: 기본 회로도 위에 필요한 정보 레이어만 켠다.
- id: P-05
  title: 교육적 정확성을 우선한다
  rule: 시각 효과보다 물리 모델의 정확한 표현을 우선한다.
- id: P-06
  title: 오류를 학습 기회로 바꾼다
  rule: 상태, 물리적 원인, 수정 행동을 회로 언어로 설명한다.
- id: P-07
  title: 로그인 없이 핵심 기능을 쓴다
  rule: 편집·시뮬레이션·출력에 계정을 먼저 요구하지 않는다.
- id: P-08
  title: 확장은 경계를 통해 한다
  rule: 새 기능이 기존 계산·편집 코드를 직접 침범하지 않게 한다.
- id: P-09
  title: 플랫폼 설정과 무관하게 같은 학습 동작을 제공한다
  rule: 주요 기능과 일반 UI의 재생·전환·표시는 운영체제·브라우저의 동작 줄이기 설정에 영향받지 않는다. 해당 설정으로 애니메이션을 정지·생략·단축하지 않으며, 재생 제어는 앱의 명시적 사용자 조작을 따른다. 숨겨진 화면·뷰 해제·오류에 따른 중지는 유지한다.
